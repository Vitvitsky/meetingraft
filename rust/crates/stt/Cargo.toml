[package]
name = "meetingraft-stt"
version.workspace = true
edition.workspace = true

[features]
default = []
# On-device Whisper. Включать при локальной сборке macOS / generate-ffi.
whisper = ["dep:whisper-rs"]
# Русский GigaAM v3 через sherpa-onnx. Выключен по умолчанию по той же
# причине, что и `diarize/model`: `build.rs` крейта `sherpa-onnx` **ходит
# в сеть** за готовыми статическими библиотеками, а обычная сборка —
# включая CI и Linux — не должна качать ничего.
#
# Отличие от `whisper` в нашу пользу: ускоритель тут не Metal, а
# onnxruntime, поэтому фича собирается и работает на Linux. Движок можно
# проверить компилятором и прогнать прибором без Мака.
gigaam = ["dep:sherpa-onnx"]
# Многоязычный parakeet-tdt-0.6b-v3. Та же цена сборки, что у gigaam:
# `build.rs` крейта sherpa-onnx ходит в сеть.
parakeet = ["dep:sherpa-onnx"]
# Потоковый русский T-one. Он единственный здесь работает чанками и сам
# ставит границы реплик — оси нарезки у него нет.
tone = ["dep:sherpa-onnx"]
# Silero VAD — тот, что обещан ADR-005 и до сих пор не построен. Тот же
# крейт, что у `gigaam`, поэтому по размеру бинаря почти бесплатно;
# отдельная фича, потому что вопросы разные и включать их по одному
# должно быть можно.
vad = ["dep:sherpa-onnx"]

[dependencies]
meetingraft-domain = { path = "../domain" }
uuid = { version = "1", features = ["v4"] }
# Тот же крейт и та же версия, что у `meetingraft-diarize`: тулкит
# линкуется целиком, и разъехавшиеся версии означали бы две его копии в
# бинаре.
sherpa-onnx = { version = "1.13", optional = true }

# Ускоритель выбирается по платформе, а не по фиче: Metal существует только
# на Apple, и без этого разделения крейт с `--features whisper` вообще не
# собирается на Linux — то есть движок нельзя даже проверить компилятором
# вне Mac.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", optional = true, default-features = false, features = [
    "metal",
] }

# CPU-сборка whisper.cpp. Требует cmake в системе.
[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = { version = "0.16", optional = true, default-features = false }

[lib]
name = "stt"
