[package]
name = "meetingraft-postcall"
version.workspace = true
edition.workspace = true

[dependencies]
meetingraft-domain = { path = "../domain" }
meetingraft-glossary = { path = "../glossary" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
mockito = "1"

[lib]
name = "postcall"
