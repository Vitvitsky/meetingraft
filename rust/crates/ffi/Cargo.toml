[package]
name = "meetingraft-ffi"
version.workspace = true
edition.workspace = true

[lib]
name = "meetingraft_ffi"
crate-type = ["cdylib", "lib"]

[features]
default = []
# Прокинуть Metal Whisper в dylib (локальная macOS-сборка / generate-ffi).
whisper = ["meetingraft-stt/whisper"]
# Настоящая модель эмбеддинга голоса (ADR-013). Без неё пересчёт слепков
# отказывается вслух, а не подписывает наугад: движка нет, и считать
# похожесть нечем.
diarize = ["meetingraft-diarize/model"]
# Русский движок GigaAM v3 в post-call проходе. Без неё выбор «GigaAM» в
# настройках недоступен, а `Auto` всегда остаётся на Whisper: движка нет
# в бинаре вовсе.
gigaam = ["meetingraft-stt/gigaam"]

[dependencies]
meetingraft-diarize = { path = "../diarize" }
meetingraft-domain = { path = "../domain" }
meetingraft-glossary = { path = "../glossary" }
meetingraft-postcall = { path = "../postcall" }
meetingraft-session = { path = "../session" }
meetingraft-storage = { path = "../storage" }
meetingraft-stt = { path = "../stt" }
meetingraft-sync = { path = "../sync" }
meetingraft-translate = { path = "../translate" }
serde_json = "1"
uniffi = "0.32"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
mockito = "1"
# Только для тестов: испортить колонку в базе напрямую, чтобы проверить,
# что сбой чтения доходит до вызывающего, а не выдаётся за пустой ответ.
rusqlite = { version = "0.37", features = ["bundled"] }
