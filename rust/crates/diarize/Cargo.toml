[package]
name = "meetingraft-diarize"
version.workspace = true
edition.workspace = true

[features]
default = []
# Настоящая модель разделения голосов: sherpa-onnx (кандидат из таблицы
# спеки). Выключена по умолчанию по двум причинам сразу.
#
# Первая — цена. Крейт линкует **весь** тулкит, а не одну диаризацию:
# в архиве 15 статических библиотек на 132 МБ, и release-бинарь программы,
# которая зовёт только диаризацию, весит 34 МБ и несёт в себе espeak-ng,
# piper, Kokoro и второй распознаватель речи рядом с нашим whisper.
#
# Вторая — сборка **ходит в сеть**: `build.rs` качает готовые библиотеки с
# GitHub Releases. `cmake` при этом не нужен вовсе, но обычная сборка —
# включая CI и Linux — не должна качать ничего.
model = ["dep:sherpa-onnx"]

[dependencies]
# Лист графа: типы подписи говорящего общие с хранилищем и пересбором, и
# заводить их здесь второй раз значило бы развести две правды об одном.
meetingraft-domain = { path = "../domain" }
sherpa-onnx = { version = "1.13", optional = true }

[lib]
name = "diarize"
