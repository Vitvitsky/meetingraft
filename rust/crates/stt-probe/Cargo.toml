[package]
name = "meetingraft-stt-probe"
version.workspace = true
edition.workspace = true

[[bin]]
name = "stt-probe"
path = "src/main.rs"

[features]
default = []
# Прогон с настоящим движком GigaAM. Без неё прибор отказывает на
# самопроверке — и это его честный ответ, а не поломка.
gigaam = ["meetingraft-stt/gigaam"]
# То же для многоязычного parakeet. Вместе с `gigaam` не включается:
# прибор судит **один** движок за прогон, и молча выбранный из двух — это
# число, про которое неизвестно, чьё оно.
parakeet = ["meetingraft-stt/parakeet"]

[dependencies]
meetingraft-stt = { path = "../stt" }
