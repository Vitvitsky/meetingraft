[package]
name = "meetingraft-bench"
version.workspace = true
edition.workspace = true
publish = false

# Движки прячутся за фичами по образцу `stt/gigaam` и `diarize/model`:
# `build.rs` крейта sherpa-onnx ходит в сеть, и обычная сборка не должна
# качать ничего.
[features]
default = []
# Экспорт встречи из данных приложения. Тянет `storage` и гоняется на
# Маке — там лежат встречи; на Linux он не нужен и не собирается.
export = ["dep:storage"]

[dependencies]
domain = { package = "meetingraft-domain", path = "../domain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
storage = { package = "meetingraft-storage", path = "../storage", optional = true }

[lib]
name = "meetingraft_bench"
path = "src/lib.rs"

[[bin]]
name = "meetingraft-bench"
path = "src/main.rs"
