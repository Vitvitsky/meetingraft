[package]
name = "meetingraft-bench"
version.workspace = true
edition.workspace = true
publish = false

# Движки прячутся за фичами по образцу `stt/gigaam` и `diarize/model`:
# `build.rs` крейта sherpa-onnx ходит в сеть, и обычная сборка не должна
# качать ничего.
[features]
default = []
# Экспорт встречи из данных приложения. Тянет `storage` и гоняется на
# Маке — там лежат встречи; на Linux он не нужен и не собирается.
export = ["dep:storage"]
# Русский распознаватель. Тянет sherpa-onnx через `stt`.
gigaam = ["dep:stt", "stt/gigaam"]
# Многоязычный parakeet. В отличие от прибора, здесь он живёт **рядом** с
# gigaam: стенд для того и есть, чтобы гонять их на одном материале.
parakeet = ["dep:stt", "stt/parakeet"]
# Нарезка по речи.
vad = ["dep:stt", "stt/vad"]
# Нарезка по голосам.
diarize = ["dep:diarize", "diarize/model"]

[dependencies]
domain = { package = "meetingraft-domain", path = "../domain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
storage = { package = "meetingraft-storage", path = "../storage", optional = true }
stt = { package = "meetingraft-stt", path = "../stt", optional = true }
diarize = { package = "meetingraft-diarize", path = "../diarize", optional = true }

[lib]
name = "meetingraft_bench"
path = "src/lib.rs"

[[bin]]
name = "meetingraft-bench"
path = "src/main.rs"
