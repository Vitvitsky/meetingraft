[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/glossary",
    "crates/postcall",
    "crates/session",
    "crates/storage",
    "crates/stt",
    "crates/sync",
    "crates/translate",
    "crates/ffi",
    "crates/uniffi-bindgen",
    "crates/echo-probe",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

# Зависимости собираются с оптимизацией даже в debug.
#
# Приложение линкует именно debug-dylib (`generate-ffi.sh`), release-пути
# нет вовсе. Без этого кодирование FLAC занимало 145 мс на пачку под
# мьютексом ядра — при бюджете 50 мс, которым `drain_events` ходит за
# живыми субтитрами. Наши крейты остаются неоптимизированными: отладка и
# внятные паники важнее, а стоят они здесь недорого.
[profile.dev.package."*"]
opt-level = 2
