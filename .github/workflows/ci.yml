name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: macos-15
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Формат
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Тесты
        run: cargo test

  macos:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/macos
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Собрать Rust FFI (dylib)
        working-directory: rust
        run: |
          export CARGO_TARGET_DIR="${GITHUB_WORKSPACE}/rust/target"
          cargo build -p meetingraft-ffi
      - name: Установить XcodeGen и SwiftFormat
        run: brew install xcodegen swiftformat
      - name: Линт Swift
        run: swiftformat Sources Tests --lint
      - name: Сгенерировать проект
        run: xcodegen generate
      - name: Собрать приложение
        run: >
          xcodebuild -project MeetingRaft.xcodeproj -scheme MeetingRaft
          -configuration Debug build CODE_SIGNING_ALLOWED=NO
      - name: Юнит-тесты
        run: >
          xcodebuild -project MeetingRaft.xcodeproj -scheme MeetingRaft
          -configuration Debug test CODE_SIGNING_ALLOWED=NO

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync deps
        run: uv sync --extra dev
      - name: Ruff
        run: uv run ruff check app tests
      - name: Pytest
        run: uv run pytest
