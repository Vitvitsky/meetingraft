services:
  api:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      MEETINGRAFT_API_TOKEN: dev-token
      # OpenAI-compatible LLM for brief/follow_up (optional). Base без /v1.
      # Пример: LLM_BASE_URL=http://93.189.243.223:58001 LLM_API_KEY=... LLM_MODEL=...
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
